<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Managed by workstation/steps/70-desktop/chrome-fontconfig.sh — edit
     there, not here. Chrome 154+ statically links a newer fontconfig whose
     cache-12 files and cache-9 symlinks crash the system 2.17 library
     Plasma uses, so Chrome gets the system's font dirs and rules but its
     own cache dir. -->
<fontconfig>
	<dir>/usr/share/fonts</dir>
	<dir>/usr/local/share/fonts</dir>
	<dir prefix="xdg">fonts</dir>
	<dir>~/.fonts</dir>

	<include ignore_missing="yes">/etc/fonts/conf.d</include>

	<cachedir prefix="xdg">fontconfig-chrome</cachedir>
</fontconfig>
