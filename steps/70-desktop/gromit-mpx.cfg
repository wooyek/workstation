# Gromit-MPX tools for on-screen annotation with the Huion Q620M.
#
# Deliberately NOT keyed to input-device names. Gromit matches a tool to an
# XInput device by name, but Gromit runs under XWayland, where the device
# names KWin exposes are not the kernel names in /proc/bus/input/devices and
# shift between sessions. "default" catches whatever device draws, which is
# what we want: the pen and the mouse should both annotate.
#
# The Q620M pen has no eraser end — hid-uclogic exposes only a "Pen" device,
# no separate "Eraser" — so erasing rides on the pen's lower side button,
# which arrives as Button3. That is also Gromit's own default mapping.
#
# minsize/maxsize are what make pressure visible: Gromit scales the stroke
# between them from the pen's ABS_PRESSURE axis. A tool with a single fixed
# size ignores pressure entirely, which is how this looked under the Huion
# user-space driver, where the pen arrived as a plain mouse with no pressure
# axis at all.

"red Pen" = PEN (size=6 minsize=2 maxsize=14 color="red");
"blue Pen" = "red Pen" (color="blue");
"yellow Pen" = "red Pen" (color="yellow");
"green Marker" = PEN (size=8 minsize=4 maxsize=18 color="green" arrowsize=1);

"Eraser" = ERASER (size=75);

# A straight arrow, not a freehand one: LINE draws point-to-point, so the
# stroke lands where you aimed it. arrowsize is a multiplier on line width,
# so it has to track `size` — at size=5 a factor of 2 gives a head that reads
# from across a room. arrowtype defaults to "end"; "double" and "start" are
# the other options.
"red Arrow" = LINE (color="red" size=5 arrowsize=2);
"blue Circle" = CIRCLE (color="blue" size=3);
"red Rectangle" = RECT (color="red" size=4);

"default" = "red Pen";
"default"[SHIFT] = "blue Pen";
"default"[CONTROL] = "yellow Pen";
"default"[2] = "green Marker";
"default"[Button3] = "Eraser";
"default"[ALT] = "red Arrow";
"default"[ALT,SHIFT] = "blue Circle";
"default"[ALT,CONTROL] = "red Rectangle";

# Hot keys stay at Gromit's defaults (F9 toggle / F8 undo) because the pad
# keys are rebound to those same keysyms in KDE — see huion-tablet-gromit.sh.
